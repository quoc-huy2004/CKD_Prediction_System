<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Popup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <button id="chatbot-toggle"><i class="bi bi-robot"></i></button>
    
    <div id="chatbot">
        <div id="chatbot-header">
            <div id="logo">
                <i class="bi bi-robot"></i>
            </div>
            <div id="title">
                <h4>AI Chatbot</h4>
                <p>Ask me anything about CKD</p>
            </div>
            <button id="header-toggle"><i class="bi bi-x"></i></button>
        </div>

        <div id="messages">
            <!-- Loading indicator -->
            <div id="loading" style="display: none;">
                <div class="spinner"></div>
            </div>
        </div>

        <div id="chat-input">
            <input type="text" id="user-input" placeholder="Type your question...">
            <button id="send-button"><i class="bi bi-send"></i></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
